<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile</title>

    <link rel="stylesheet" href="css/student-profile.css">

</head>


<body>

    <main class="student-profile-page">

        <div class="student-profile-container">

            <!-- TOP BAR -->

            <div class="student-profile-topbar">

                <button type="button" id="back-to-students" class="back-button">
                    ← Back to Students
                </button>


                <button type="button" id="edit-student-button" class="edit-student-button" style="display: none;">
                    Edit Student
                </button>

            </div>


            <!-- PROFILE -->

            <div id="student-profile-card" class="student-profile-card">

                <div class="loading-message">
                    Loading student profile...
                </div>

            </div>

        </div>

    </main>


    <script type="module" src="js/student-profile.js"></script>

</body>

</html>
